name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "4.0"]
        appraisal: [standalone, rails-7-2, rails-8-0, rails-8-1]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install appraisal dependencies
        run: bundle exec appraisal ${{ matrix.appraisal }} bundle install

      - name: Run tests
        run: bundle exec appraisal ${{ matrix.appraisal }} rspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Verify YARD documentation coverage
        run: bundle exec rake yardstick
